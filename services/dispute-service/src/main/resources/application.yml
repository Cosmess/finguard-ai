spring:
  application:
    name: dispute-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finguard_dispute
    username: finguard
    password: finguard
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
