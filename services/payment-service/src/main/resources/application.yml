spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finguard_payment
    username: finguard
    password: finguard
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

payment:
  outbox:
    publishing-enabled: true
    topic: transaction.created
    fixed-delay: 5s
    max-attempts: 5
