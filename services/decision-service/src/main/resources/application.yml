spring:
  application:
    name: decision-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finguard_decision
    username: finguard
    password: finguard
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
